function save(){try{localStorage.setItem(K,JSON.stringify(used))}catch(e){}}
function rnd(a,b){return a+Math.random()*(b-a)}

/* escala 1080x1920 a cualquier pantalla */
function fit(){var s=Math.min(innerWidth/1080,innerHeight/1920),S=$('#S');S.style.transform='scale('+s+')';S.style.left=(innerWidth-1080*s)/2+'px';S.style.top=(innerHeight-1920*s)/2+'px'}
addEventListener('resize',fit);fit();

/* texto animado letra por letra */
function split(el,d0,step){var t=el.textContent,n=0;el.textContent='';for(var i=0;i<t.length;i++){var s=document.createElement('span');s.className='ch';s.textContent=t[i];s.style.setProperty('--d',(d0+n*step).toFixed(2));el.appendChild(s);n++}}
split($('#h1'),1.4,.03);split($('#h2'),2.1,.018);

/* destellos */
function sparkles(box,n){for(var i=0;i<n;i++){var s=document.createElement('i');s.className='sp';var z=rnd(16,38);s.style.cssText='--z:'+z+'px;--t:'+rnd(1.8,3.4)+'s;--dl:'+rnd(0,3)+'s;left:'+rnd(4,88)+'%;top:'+rnd(2,85)+'%';box.appendChild(s)}}

/* tarjetas */
var CH='<svg viewBox="0 0 24 24" fill="none" stroke="#1456d8" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
$('#G').innerHTML=B.map(function(b,i){return '<div class="card" data-id="'+b.id+'" role="button" tabindex="0" style="--i:'+i+'"><div class="ico"><svg viewBox="0 0 260 220">'+b.svg+'</svg></div><div class="info'+(b.row?' row':'')+'"><b>'+b.big+'</b><span>'+b.lbl+'</span></div><div class="go">'+CH+'</div><div class="stamp">CANJEADO</div></div>'}).join('');
document.querySelectorAll('.card').forEach(function(c){sparkles(c.querySelector('.ico'),7);c.onclick=function(){open1(c.dataset.id)};c.onkeydown=function(e){if(e.key=='Enter'||e.key==' ')open1(c.dataset.id)}});
sparkles($('#title'),0);
(function(){var t=$('#ring');for(var i=0;i<10;i++){var s=document.createElement('i');s.className='sp';s.style.cssText='--z:'+rnd(22,44)+'px;--t:'+rnd(1.8,3)+'s;--dl:'+rnd(1.2,4)+'s;left:'+(60+i*95)+'px;top:'+rnd(150,330)+'px;position:absolute;z-index:5';$('#S').appendChild(s)}})();
function render(){document.querySelectorAll('.card').forEach(function(c){c.classList.toggle('used',!!used[c.dataset.id])})}render();

/* hoja inferior */
function sheet(h){$('#sheet').innerHTML=h;$('#ov').classList.add('on');$('#sheet').style.animation='none';void $('#sheet').offsetWidth;$('#sheet').style.animation=''}
function close1(){$('#ov').classList.remove('on')}
$('#ov').onclick=function(e){if(e.target.id=='ov')close1()};
function toast(t){var e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(function(){e.classList.remove('on')},2200)}
function ico(b){return '<div class="sico"><svg viewBox="0 0 260 220">'+b.svg+'</svg></div>'}
function burst(){var r=$('#sheet').getBoundingClientRect(),S=$('#S').getBoundingClientRect(),k=1080/S.width;for(var i=0;i<32;i++){var s=document.createElement('i');s.className='fly';var a=Math.random()*6.28,d=rnd(250,560);s.style.cssText='left:540px;top:'+((r.top-S.top)*k+200)+'px;--dx:'+Math.cos(a)*d+'px;--dy:'+Math.sin(a)*d+'px';$('#S').appendChild(s);setTimeout(function(x){x.remove()},1400,s)}}
function open1(id){
 var b=B.filter(function(x){return x.id==id})[0];
 if(used[id]){toast('Este beneficio ya fue usado');return}
 sheet(ico(b)+'<h2>'+b.name+'</h2><p>'+b.desc+'</p><div class="warn">Beneficio de un solo uso. Una vez canjeado no podrás volver a usarlo.</div><button class="btn p" id="ok">Canjear ahora</button><button class="btn s" id="no">Ahora no</button>');
 $('#no').onclick=close1;
 $('#ok').onclick=function(){
  var code='VIP-'+Math.random().toString(36).slice(2,8).toUpperCase(),prize=b.gift?PREMIOS[Math.floor(Math.random()*PREMIOS.length)]:'';
  used[id]={code:code,t:Date.now(),prize:prize,name:b.name};save();render();
  sheet(ico(b)+'<h2>¡Beneficio canjeado!</h2>'+(prize?'<p class="prize">'+prize+'</p>':'')+'<div class="code">'+code+'</div><p>Muéstrale este código al asesor. Este beneficio ya no se puede usar de nuevo.</p><button class="btn p" id="no">Listo</button>');
  $('#no').onclick=close1;burst();
 }}

/* navegación */
document.querySelectorAll('.ni').forEach(function(n){n.onclick=function(){
 var k=n.dataset.n;
 if(k=='h'){var l=Object.keys(used).map(function(i){return used[i]});
  sheet('<h2>Historial</h2>'+(l.length?l.map(function(u){return '<div class="hi"><span>'+u.name+(u.prize?' · '+u.prize:'')+'</span><b>'+u.code+'</b></div>'}).join(''):'<p>Aún no has canjeado beneficios. Toca uno para empezar.</p>')+(l.length?'<button class="btn s" id="rs">Reiniciar beneficios</button>':'')+'<button class="btn p" id="no">Cerrar</button>');
  $('#no').onclick=close1;
  if($('#rs'))$('#rs').onclick=function(){used={};save();render();close1();toast('Beneficios reiniciados')}}
 else if(k!='v')toast('Próximamente')}});
</script>
</body>
</html>
